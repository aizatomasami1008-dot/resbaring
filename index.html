<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>レスバリング</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 1rem; }
#app { width: 100%; max-width: 660px; background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.08); margin-top: 1rem; }
.header { padding: 1.25rem 1.5rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 20px; font-weight: 600; }
.logo span { color: #D85A30; }
.badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; background: #e8f5e9; color: #2e7d32; }

/* SETUP */
.setup { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
.card { background: #fafafa; border: 1px solid #eee; border-radius: 12px; padding: 1.25rem; }
.card h3 { font-size: 13px; color: #888; margin-bottom: 0.75rem; font-weight: 500; }
.topic-input { width: 100%; padding: 10px 14px; font-size: 15px; border: 1px solid #ddd; border-radius: 8px; background: white; font-family: inherit; }
.topic-input:focus { outline: none; border-color: #999; }
.player-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pc { border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; gap: 8px; }
.pa { background: #e8f0fb; border: 1px solid #b5d4f4; }
.pb { background: #fdf0ea; border: 1px solid #f5c4b3; }
.plabel { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
.pa .plabel { color: #185FA5; }
.pb .plabel { color: #993C1D; }
.pname { background: transparent; border: none; border-bottom: 1px solid rgba(0,0,0,0.15); font-size: 15px; font-weight: 600; width: 100%; padding: 2px 0; font-family: inherit; }
.pname:focus { outline: none; }
.time-field { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.time-field label { font-size: 11px; color: #888; }
.time-input { padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; background: white; }
.win-cond { display: flex; flex-direction: column; gap: 8px; }
.win-opt { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #444; cursor: pointer; }
.round-select { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.round-btn { padding: 6px 14px; font-size: 13px; border: 1px solid #ddd; border-radius: 20px; background: white; cursor: pointer; color: #444; }
.round-btn.active { background: #222; color: white; border-color: #222; }
.round-custom { display: none; align-items: center; gap: 8px; margin-top: 8px; }
.round-custom.show { display: flex; }
.round-custom input { width: 80px; padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; }
.round-custom label { font-size: 13px; color: #666; }
.start-btn { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; background: #222; color: white; border: none; border-radius: 12px; cursor: pointer; }
.start-btn:hover { background: #444; }
.test-btn { width: 100%; padding: 10px; font-size: 13px; background: transparent; border: 1px solid #ddd; border-radius: 12px; cursor: pointer; color: #888; margin-top: -8px; }
.test-btn:hover { background: #f5f5f0; }

/* ECOIN VISUAL */
.ecoin-sec { padding: 1rem 1.5rem 0.5rem; background: #1a1a2e; border-bottom: 1px solid #333; position: relative; overflow: hidden; }
.ecoin-title { font-size: 10px; color: #666; text-align: center; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 0.5rem; }
.ecoin-arena { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; min-height: 100px; }
.ecoin-side { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ecoin-name { font-size: 11px; font-weight: 600; }
.ecoin-name.a { color: #5ba4f5; }
.ecoin-name.b { color: #f5845b; }
.ecoin-amount { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ecoin-amount.a { color: #5ba4f5; }
.ecoin-amount.b { color: #f5845b; }
.ecoin-stack { display: flex; flex-direction: column-reverse; align-items: center; gap: 0px; min-height: 20px; transition: all 0.6s ease; }
.coin { height: 7px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); transition: all 0.4s ease; }
.coin.a { background: linear-gradient(180deg, #7bc0ff, #2979d4); }
.coin.b { background: linear-gradient(180deg, #ffb08a, #d44a1a); }
.ecoin-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding-bottom: 4px; }
.ecoin-vs { font-size: 14px; font-weight: 700; color: #555; }
.ecoin-turn-count { font-size: 10px; color: #555; }
.judge-progress { display: flex; gap: 2px; margin-top: 4px; }
.judge-pip { width: 8px; height: 8px; border-radius: 50%; background: #333; transition: background 0.3s; }
.judge-pip.done { background: #f5d76e; }

/* TIMER ROW */
.timer-row { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid #eee; }
.timer-box { padding: 8px 1.5rem; display: flex; align-items: center; gap: 10px; }
.timer-box.a { border-right: 1px solid #eee; }
.timer-dot { width: 6px; height: 6px; border-radius: 50%; background: #ddd; flex-shrink: 0; }
.timer-dot.on { background: #2ecc71; animation: tpulse 1s infinite; }
@keyframes tpulse { 0%,100%{opacity:1}50%{opacity:0.3} }
.timer-label { font-size: 11px; color: #aaa; margin-bottom: 2px; }
.timer-val { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.timer-val.a { color: #185FA5; }
.timer-val.b { color: #D85A30; }
.timer-val.warn { color: #e67e22 !important; }
.timer-val.danger { color: #e74c3c !important; animation: tblink 0.5s infinite; }
@keyframes tblink { 0%,100%{opacity:1}50%{opacity:0.3} }
.obj-counter { font-size: 10px; color: #aaa; margin-top: 2px; }

.round-indicator { font-size: 11px; color: #aaa; text-align: center; padding: 4px; border-bottom: 1px solid #eee; background: #fafafa; }
.turn-bar { padding: 6px 1.5rem; background: white; border-bottom: 1px solid #eee; font-size: 12px; color: #888; display: flex; align-items: center; gap: 8px; }
.tdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.tdot.a { background: #378ADD; }
.tdot.b { background: #D85A30; }
.tdot.judging { background: #f5d76e; animation: tpulse 1s infinite; }

/* MESSAGES */
.msgs { overflow-y: auto; padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 10px; min-height: 200px; max-height: 280px; }
.msg { max-width: 82%; border-radius: 12px; padding: 10px 14px; font-size: 14px; line-height: 1.6; }
.msg.a { align-self: flex-start; background: #e8f0fb; border: 1px solid #b5d4f4; color: #0C447C; }
.msg.b { align-self: flex-end; background: #fdf0ea; border: 1px solid #f5c4b3; color: #712B13; }
.msg.judge { align-self: center; max-width: 96%; background: #1a1a2e; border: 1px solid #333; color: #ccc; font-size: 12px; cursor: pointer; border-radius: 10px; }
.msg.penalty { align-self: center; max-width: 92%; background: #fff0f0; border: 1px solid #ffd0d0; color: #c00; font-size: 12px; text-align: center; }
.msg.objection { align-self: center; max-width: 92%; background: #fffbea; border: 1px solid #f5d76e; color: #7d6608; font-size: 12px; }
.msg.bonus { align-self: center; max-width: 92%; background: #e8f5e9; border: 1px solid #c8e6c9; color: #2e7d32; font-size: 12px; text-align: center; }
.msg.concede { align-self: center; max-width: 92%; background: #f3f0ff; border: 1px solid #d4c8f5; color: #5b4d8a; font-size: 12px; text-align: center; }
.msg.system { align-self: center; max-width: 92%; background: #fff8e1; border: 1px solid #ffe082; color: #7d6608; font-size: 12px; text-align: center; font-weight: 600; }
.mmeta { font-size: 11px; margin-bottom: 4px; font-weight: 600; opacity: 0.6; }

/* JUDGE PANEL */
.judge-closed { font-size: 12px; color: #f5d76e; font-style: italic; text-align: center; padding: 4px 0; }
.judge-detail { display: none; padding-top: 8px; }
.judge-detail.open { display: block; }
.judge-scores { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.jscore { text-align: center; background: rgba(255,255,255,0.05); border-radius: 6px; padding: 6px 4px; }
.jscore-label { font-size: 9px; color: #888; margin-bottom: 2px; }
.jscore-vals { display: flex; justify-content: center; gap: 6px; }
.jscore-val { font-size: 13px; font-weight: 700; }
.jscore-val.a { color: #5ba4f5; }
.jscore-val.b { color: #f5845b; }
.judge-comment { font-size: 11px; color: #888; line-height: 1.6; border-top: 1px solid #333; padding-top: 6px; margin-top: 4px; }
.judge-hint { font-size: 10px; color: #444; text-align: right; margin-top: 4px; }

/* INPUT */
.input-area { border-top: 1px solid #eee; padding: 1rem 1.5rem; background: white; }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
.arginput { flex: 1; padding: 10px 14px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; resize: none; min-height: 42px; max-height: 120px; line-height: 1.5; }
.arginput:focus { outline: none; border-color: #999; }
.sendbtn { padding: 10px 18px; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.sendbtn.a { background: #378ADD; color: white; }
.sendbtn.b { background: #D85A30; color: white; }
.sendbtn:disabled { opacity: 0.4; cursor: not-allowed; }
.climit { font-size: 11px; color: #bbb; margin-top: 4px; text-align: right; }
.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.obj-btn { padding: 8px; font-size: 12px; background: white; border: 1px solid #f5d76e; border-radius: 8px; color: #7d6608; cursor: pointer; }
.obj-btn:hover { background: #fffbea; }
.obj-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.concede-btn { padding: 8px; font-size: 12px; background: white; border: 1px solid #d4c8f5; border-radius: 8px; color: #5b4d8a; cursor: pointer; }
.concede-btn:hover { background: #f3f0ff; }
.concede-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.retract-btn { width:100%; padding: 8px; font-size: 12px; background: white; border: 1px solid #ddd; border-radius: 8px; color: #888; cursor: pointer; }
.retract-btn:hover { background: #f5f5f0; }
.retract-approve-btn { padding: 8px; font-size: 12px; background: white; border: 1px solid #c8e6c9; border-radius: 8px; color: #2e7d32; cursor: pointer; }
.retract-approve-btn:hover { background: #e8f5e9; }
.retract-deny-btn { padding: 8px; font-size: 12px; background: white; border: 1px solid #ffd0d0; border-radius: 8px; color: #c00; cursor: pointer; }
.retract-deny-btn:hover { background: #fff0f0; }

/* FINAL OBJ */
.final-obj-area { border-top: 2px solid #ffe082; padding: 1rem 1.5rem; background: #fffde7; }
.final-obj-title { font-size: 13px; font-weight: 600; color: #7d6608; margin-bottom: 8px; text-align: center; }
.final-obj-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.final-obj-btn { padding: 10px; font-size: 13px; background: white; border: 1px solid #f5d76e; border-radius: 8px; color: #7d6608; cursor: pointer; font-weight: 600; }
.final-obj-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.final-pass-btn { padding: 10px; font-size: 13px; background: white; border: 1px solid #ddd; border-radius: 8px; color: #888; cursor: pointer; }
.final-pass-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* VERDICT */
.verdict { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
.vcard { background: #1a1a2e; border: 1px solid #333; border-radius: 12px; padding: 1.5rem; text-align: center; }
.vwinner { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
.vsub { font-size: 14px; color: #666; margin-bottom: 4px; }
.vreason { margin-top: 1rem; font-size: 13px; line-height: 1.7; color: #aaa; text-align: left; }
.vscores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 1rem; }
.vsbox { padding: 1rem; border-radius: 8px; text-align: center; }
.vsbox.a { background: rgba(91,164,245,0.1); border: 1px solid rgba(91,164,245,0.3); }
.vsbox.b { background: rgba(245,132,91,0.1); border: 1px solid rgba(245,132,91,0.3); }
.vsnum { font-size: 28px; font-weight: 700; }
.vsbox.a .vsnum { color: #5ba4f5; }
.vsbox.b .vsnum { color: #f5845b; }
.vslabel { font-size: 11px; color: #666; margin-top: 4px; }
.vaxis { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
.vaxis-box { background: rgba(255,255,255,0.03); border-radius: 6px; padding: 6px; text-align: center; }
.vaxis-label { font-size: 9px; color: #555; margin-bottom: 4px; }
.vaxis-vals { display: flex; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600; }
.vbadge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 20px; margin-bottom: 8px; }
.vbadge.time { background: rgba(245,132,91,0.2); color: #f5845b; }
.vbadge.score { background: rgba(255,0,0,0.1); color: #f55; }
.vbadge.points { background: rgba(91,164,245,0.2); color: #5ba4f5; }
.vbadge.concede { background: rgba(180,160,255,0.2); color: #b4a0ff; }
.verdict-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.restart-btn { padding: 12px; font-size: 14px; background: white; border: 1px solid #ddd; border-radius: 12px; cursor: pointer; }
.restart-btn:hover { background: #f5f5f0; }
.log-btn { padding: 12px; font-size: 14px; background: white; border: 1px solid #b5d4f4; border-radius: 12px; cursor: pointer; color: #185FA5; }
.log-btn:hover { background: #e8f0fb; }

/* LOG MODAL */
.log-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
.log-inner { background: white; border-radius: 16px; width: 100%; max-width: 600px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; }
.log-header { padding: 1rem 1.5rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
.log-header h3 { font-size: 15px; font-weight: 600; }
.log-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #888; }
.log-body { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; font-size: 13px; line-height: 1.8; white-space: pre-wrap; color: #333; }
.log-footer { padding: 1rem 1.5rem; border-top: 1px solid #eee; }
.copy-btn { width: 100%; padding: 10px; font-size: 14px; background: #222; color: white; border: none; border-radius: 8px; cursor: pointer; }
.copy-btn.copied { background: #2e7d32; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">レス<span>バ</span>リング</div>
    <div class="badge" id="badge">設定中</div>
  </div>

  <div id="s-setup" class="setup">
    <div class="card">
      <h3>討論テーマ</h3>
      <input class="topic-input" id="topic" placeholder="例：SNSは社会を分断するか" />
    </div>
    <div class="card">
      <h3>参加者・持ち時間</h3>
      <div class="player-row">
        <div class="pc pa">
          <div class="plabel">青コーナー</div>
          <input class="pname" id="na" value="選手A" />
          <div class="time-field"><label>持ち時間（分）</label><input class="time-input" id="ta" type="number" value="5" min="1" max="60" /></div>
        </div>
        <div class="pc pb">
          <div class="plabel">赤コーナー</div>
          <input class="pname" id="nb" value="選手B" />
          <div class="time-field"><label>持ち時間（分）</label><input class="time-input" id="tb" type="number" value="5" min="1" max="60" /></div>
        </div>
      </div>
    </div>
    <div class="card">
      <h3>ラウンド数（6発言×N回）</h3>
      <div class="round-select" id="round-select">
        <button class="round-btn active" data-val="0">無制限</button>
        <button class="round-btn" data-val="1">1</button>
        <button class="round-btn" data-val="2">2</button>
        <button class="round-btn" data-val="3">3</button>
        <button class="round-btn" data-val="5">5</button>
        <button class="round-btn" data-val="custom">カスタム</button>
      </div>
      <div class="round-custom" id="round-custom">
        <input type="number" id="round-custom-val" value="4" min="1" max="20" />
        <label>ラウンド</label>
      </div>
    </div>
    <div class="card">
      <h3>勝敗条件</h3>
      <div class="win-cond">
        <label class="win-opt"><input type="checkbox" id="wc-time" checked /> 持ち時間ゼロで敗北</label>
        <label class="win-opt"><input type="checkbox" id="wc-score" checked /> Eコインゼロで敗北</label>
      </div>
    </div>
    <button class="start-btn" id="start-btn">討論開始</button>
    <button class="test-btn" id="test-btn">🧪 テストモードで開始（死刑制度）</button>
  </div>

  <div id="s-debate" class="debate" style="display:none">
    <!-- ECOIN VISUAL -->
    <div class="ecoin-sec" id="ecoin-sec">
      <div class="ecoin-title">E C O I N</div>
      <div class="ecoin-arena">
        <div class="ecoin-side">
          <div class="ecoin-stack" id="stack-a"></div>
          <div class="ecoin-amount a" id="ecoin-a">100</div>
          <div class="ecoin-name a" id="ename-a">選手A</div>
        </div>
        <div class="ecoin-center">
          <div class="ecoin-vs">VS</div>
          <div class="ecoin-turn-count" id="turn-count">0/6</div>
          <div class="judge-progress" id="judge-pips"></div>
        </div>
        <div class="ecoin-side">
          <div class="ecoin-stack" id="stack-b"></div>
          <div class="ecoin-amount b" id="ecoin-b">100</div>
          <div class="ecoin-name b" id="ename-b">選手B</div>
        </div>
      </div>
    </div>

    <div class="timer-row">
      <div class="timer-box a">
        <div class="timer-dot" id="tdot-a"></div>
        <div>
          <div class="timer-label" id="tlabel-a">選手A</div>
          <div class="timer-val a" id="tval-a">5:00</div>
          <div class="obj-counter" id="obj-count-a">異議 3回</div>
        </div>
      </div>
      <div class="timer-box b">
        <div class="timer-dot" id="tdot-b"></div>
        <div>
          <div class="timer-label" id="tlabel-b">選手B</div>
          <div class="timer-val b" id="tval-b">5:00</div>
          <div class="obj-counter" id="obj-count-b">異議 3回</div>
        </div>
      </div>
    </div>
    <div class="round-indicator" id="round-indicator">ラウンド1 準備中</div>
    <div class="turn-bar"><div class="tdot a" id="tdot"></div><span id="ttext">選手Aのターン</span></div>
    <div class="msgs" id="msgs"></div>
    <div id="input-area" class="input-area">
      <div class="input-row">
        <textarea class="arginput" id="arginput" rows="2" placeholder="主張を入力…"></textarea>
        <button class="sendbtn a" id="sendbtn">送信</button>
      </div>
      <div class="climit" id="climit">0 / 500字</div>
      <div class="action-row">
        <button class="obj-btn" id="obj-btn" disabled>⚖ 判定に異議（残3回）</button>
        <button class="concede-btn" id="concede-btn" disabled>🤝 相手の主張を認める</button>
      </div>
      <div id="retract-area" style="display:none;margin-top:8px;">
        <button class="retract-btn" id="retract-req-btn">↩ 直前の発言を取り消し申請</button>
      </div>
      <div id="retract-confirm-area" style="display:none;margin-top:8px;">
        <div style="font-size:12px;color:#7d6608;text-align:center;margin-bottom:6px;">相手が取り消しを申請しています</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <button class="retract-approve-btn" id="retract-approve-btn">✓ 承認する</button>
          <button class="retract-deny-btn" id="retract-deny-btn">✗ 拒否する</button>
        </div>
      </div>
    </div>
    <div id="final-obj-area" class="final-obj-area" style="display:none">
      <div class="final-obj-title" id="final-obj-title">最終異議フェーズ</div>
      <div class="final-obj-row">
        <button class="final-obj-btn" id="final-obj-btn">⚖ 最終発言に異議を出す</button>
        <button class="final-pass-btn" id="final-pass-btn">パスして判定へ</button>
      </div>
    </div>
  </div>

  <div id="s-verdict" class="verdict" style="display:none"></div>
</div>

<script>
// ==================== JUDGE PROMPTS ====================
const LOGIC_SYSTEM=`あなたは「論理審判」です。議論の論理構造のみを評価します。感情・説得力・証拠の信頼性は他の審判が担当するため無視してください。

【評価対象：6発言をまとめて評価】
青側（A）と赤側（B）それぞれの6発言を通して論理構造を評価します。

【加点項目（各0〜20点）】
- 前提から結論が明確に繋がっている
- 複数の論点を構造的に整理している
- 相手の論理的矛盾を正確に指摘している
- 反証可能な形で主張を立てている
- 条件付きの主張をしている（「〜の場合に限り」等）
- 相手の論理を使って相手を論破している（最高+15）

【反則・減点項目】
- 循環論法（AだからA）：-5
- 論理破綻（前提と結論が繋がらない）：-10
- 二項対立の誤り：-3
- スリッパリースロープ（根拠なき連鎖）：-5
- 偽の因果（相関を因果と混同）：-5
- 早まった一般化：-3
- 論点すり替え：-5
- 定義のすり替え：-5
- 前提の途中変更：-5

【最重要】反則は「疑いの余地なく明確な場合のみ」認定。迷ったら認定しない。

出力形式（JSONのみ、マークダウン不要）：
{"scoreA":0〜150の整数,"scoreB":0〜150の整数,"fallaciesA":[{"name":"反則名","penalty":数値,"evidence":"該当文言"}],"fallaciesB":[{"name":"反則名","penalty":数値,"evidence":"該当文言"}],"comment":"論理面の総評（2文）"}`;

const EVIDENCE_SYSTEM=`あなたは「証拠審判」です。発言における証拠・根拠の質のみを評価します。論理構造・感情・説得力は他の審判が担当するため無視してください。

【評価対象：6発言をまとめて評価】

【加点項目（各0〜20点）】
- 具体的なデータ・統計を提示している
- 信頼できる出典・事例を挙げている
- 証拠が主張を直接支持している
- 相手の証拠の弱点・限界を指摘している
- 反例を自ら提示して主張を精緻にしている
- 複数の独立した証拠で補強している

【反則・減点項目】
- 事実歪曲（統計・事実を意図的に誤用）：-15
- 権威への訴え（根拠なく権威で正当化）：-3
- 衆人への訴え（多数意見を証拠として使う）：-3
- モラル等価の誤り：-3
- 証拠の文脈無視（文脈を省いた引用）：-8
- 反証不可能な主張の断言：-5

【最重要】反則は「疑いの余地なく明確な場合のみ」認定。迷ったら認定しない。

出力形式（JSONのみ、マークダウン不要）：
{"scoreA":0〜150の整数,"scoreB":0〜150の整数,"fallaciesA":[{"name":"反則名","penalty":数値,"evidence":"該当文言"}],"fallaciesB":[{"name":"反則名","penalty":数値,"evidence":"該当文言"}],"comment":"証拠面の総評（2文）"}`;

const PERSUASION_SYSTEM=`あなたは「説得審判」です。相手への誠実な応答と説得の質のみを評価します。論理構造・証拠・知性的深さは他の審判が担当するため無視してください。

【評価対象：6発言をまとめて評価】

【加点項目（各0〜20点）】
- 相手の論点に正面から応答している
- 自分の立場を一貫して明確に示している
- 譲れる点と譲れない点を区別している
- 相手の言葉を正確に引用して反論している
- 感情的にならず冷静に議論を続けている
- 議論の流れを整理して前進させている

【反則・減点項目】
- 人身攻撃（人格への直接攻撃）：-15
- 藁人形論法（相手が言っていないことを攻撃）：-10
- 感情的訴えすぎ（感情煽動で論理の代わりにする）：-3
- 相手意見の無視（論点に一切触れず別の話をする）：-10
- 勝つための意図的単純化：-5

【最重要】反則は「疑いの余地なく明確な場合のみ」認定。迷ったら認定しない。

出力形式（JSONのみ、マークダウン不要）：
{"scoreA":0〜150の整数,"scoreB":0〜150の整数,"fallaciesA":[{"name":"反則名","penalty":数値,"evidence":"該当文言"}],"fallaciesB":[{"name":"反則名","penalty":数値,"evidence":"該当文言"}],"comment":"説得面の総評（2文）"}`;

const RATIONAL_SYSTEM=`あなたは「合理審判」です。互いの目的に対して誠実で議論を深める態度のみを評価します。

【評価対象：6発言をまとめて評価】

【加点項目（各0〜20点）】
- スティールマン：相手の最強論点を正確に再現して反論（最高+20）
- 自分の主張が崩れる条件を自ら提示（+15）
- 対立の根源を言語化する（+15）
- 第三の枠組みを提示して対立を解消する（最高+20）
- 自分の誤りを認めた上で議論を続ける（+15）
- 良い問いを立てる（+15）
- 相手の主張から自分の論を強化するヒントを見つける（+10）
- 議論全体を俯瞰した発言をする（+10）

【反則・減点項目】
- サンクコスト誤謬：-3
- 勝つための意図的単純化：-5
- 自己撞着（自分の主張・目的と矛盾する言動）：-15
  例：平等を訴えながら特定属性を差別する、証拠を重視すると言いながら自分は証拠なしに断言する

【最重要】反則は「疑いの余地なく明確な場合のみ」認定。合理的な加点は積極的に行う。

出力形式（JSONのみ、マークダウン不要）：
{"scoreA":0〜150の整数,"scoreB":0〜150の整数,"fallaciesA":[{"name":"反則名","penalty":数値,"evidence":"該当文言"}],"fallaciesB":[{"name":"反則名","penalty":数値,"evidence":"該当文言"}],"comment":"合理面の総評（2文）"}`;

const OBJ_SYSTEM=`あなたはディベート上訴審判です。異議申し立てを審査しJSONのみで返答。マークダウン不要。
【審査原則】
- 元の判定が「明確な証拠がある場合のみ反則認定」という基準を満たしているか厳密に審査する
- 異議申し立て側の主張に迎合してはいけない。正しい判定なら棄却する
- 証拠が不十分なら認容する
出力形式：{"sustained":true/false,"verdict":"審査結論（2文）","scoreAdjust":認容時の補正Eコイン（0〜10）}`;

// ==================== STATE ====================
let S={
  topic:'',na:'',nb:'',
  ecoinA:100,ecoinB:100,
  // 4軸スコア
  logicA:100,logicB:100,
  evidenceA:100,evidenceB:100,
  persuasionA:100,persuasionB:100,
  rationalA:100,rationalB:100,
  turn:'a',msgs:[],
  turnCount:0, // 6発言カウンター
  roundCount:0, // 完了したラウンド数
  maxRounds:0,
  busy:false,ended:false,
  timeA:300,timeB:300,
  initTimeA:300,initTimeB:300,
  timerInterval:null,
  lastJudgeResult:null,lastJudgeSide:null,
  canObject:false,
  objA:3,objB:3,
  wcTime:true,wcScore:true,
  log:[],
  finalObjPhase:false,
  buffer:[], // 6発言バッファ
};

const $=id=>document.getElementById(id);
let selectedRounds=0;

document.querySelectorAll('.round-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.round-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const val=btn.dataset.val;
    if(val==='custom'){selectedRounds='custom';$('round-custom').classList.add('show');}
    else{selectedRounds=parseInt(val);$('round-custom').classList.remove('show');}
  });
});

$('start-btn').addEventListener('click',()=>{
  const t=$('topic').value.trim();
  if(!t){$('topic').focus();return;}
  S.topic=t;
  S.na=$('na').value.trim()||'選手A';
  S.nb=$('nb').value.trim()||'選手B';
  S.timeA=S.initTimeA=parseInt($('ta').value||'5')*60;
  S.timeB=S.initTimeB=parseInt($('tb').value||'5')*60;
  S.wcTime=$('wc-time').checked;
  S.wcScore=$('wc-score').checked;
  S.maxRounds=selectedRounds==='custom'?parseInt($('round-custom-val').value||'4'):selectedRounds;
  $('s-setup').style.display='none';
  $('s-debate').style.display='flex';
  $('s-debate').style.flexDirection='column';
  $('badge').textContent='討論中';
  $('ename-a').textContent=S.na;$('ename-b').textContent=S.nb;
  $('tlabel-a').textContent=S.na;$('tlabel-b').textContent=S.nb;
  S.log.push(`■ テーマ：${S.topic}`);
  S.log.push(`■ 参加者：${S.na}（青）vs ${S.nb}（赤）`);
  const rLabel=S.maxRounds===0?'無制限':`${S.maxRounds}ラウンド`;
  S.log.push(`■ 持ち時間：各${Math.floor(S.initTimeA/60)}分　ラウンド：${rLabel}\n${'─'.repeat(40)}`);
  initJudgePips();
  updateEcoinVisual(false);
  updateTurn();updateTimerDisplay();updateObjCount();updateRoundIndicator();
  addMsg('judge',null,`テーマ：「${S.topic}」　討論開始。${S.na}から先攻。`);
  startTimer();
});

function initJudgePips(){
  const container=$('judge-pips');
  container.innerHTML='';
  for(let i=0;i<6;i++){
    const pip=document.createElement('div');
    pip.className='judge-pip';
    pip.id=`pip-${i}`;
    container.appendChild(pip);
  }
}

function updateJudgePip(idx){
  const pip=$(`pip-${idx}`);
  if(pip) pip.classList.add('done');
}

function resetJudgePips(){
  for(let i=0;i<6;i++){
    const pip=$(`pip-${i}`);
    if(pip) pip.classList.remove('done');
  }
}

// ==================== ECOIN VISUAL ====================
function updateEcoinVisual(animate=true){
  $('ecoin-a').textContent=Math.round(S.ecoinA);
  $('ecoin-b').textContent=Math.round(S.ecoinB);
  $('turn-count').textContent=`${S.turnCount}/6`;
  renderStack('stack-a', S.ecoinA, 'a', animate);
  renderStack('stack-b', S.ecoinB, 'b', animate);
}

function renderStack(id, amount, side, animate){
  const stack=$(id);
  const coins=Math.max(0,Math.min(20, Math.round(amount/10)));
  // 山形：下から上に向かって幅が狭くなる
  const maxW=44, minW=18;
  stack.innerHTML='';
  for(let i=0;i<coins;i++){
    const coin=document.createElement('div');
    // i=0が一番下（最大幅）、i=coins-1が一番上（最小幅）
    const ratio=coins>1?i/(coins-1):0;
    const w=Math.round(maxW-(maxW-minW)*ratio);
    coin.className=`coin ${side}`;
    coin.style.width=w+'px';
    if(animate){coin.style.opacity='0';setTimeout(()=>{coin.style.opacity='1';},i*30);}
    stack.appendChild(coin);
  }
}

// ==================== TIMER ====================
function startTimer(){
  if(S.timerInterval) clearInterval(S.timerInterval);
  S.timerInterval=setInterval(()=>{
    if(S.busy||S.ended||S.finalObjPhase) return;
    if(S.turn==='a'){
      S.timeA=Math.max(0,S.timeA-1);
      if(S.timeA===0&&S.wcTime){endDebate('time','b');return;}
    } else {
      S.timeB=Math.max(0,S.timeB-1);
      if(S.timeB===0&&S.wcTime){endDebate('time','a');return;}
    }
    updateTimerDisplay();
  },1000);
}

function fmt(s){const m=Math.floor(s/60),sec=s%60;return `${m}:${String(sec).padStart(2,'0')}`;}

function updateTimerDisplay(){
  $('tval-a').textContent=fmt(S.timeA);
  $('tval-b').textContent=fmt(S.timeB);
  $('tval-a').className='timer-val a'+(S.timeA<=30?' danger':S.timeA<=60?' warn':'');
  $('tval-b').className='timer-val b'+(S.timeB<=30?' danger':S.timeB<=60?' warn':'');
  $('tdot-a').className='timer-dot'+(S.turn==='a'&&!S.busy&&!S.ended&&!S.finalObjPhase?' on':'');
  $('tdot-b').className='timer-dot'+(S.turn==='b'&&!S.busy&&!S.ended&&!S.finalObjPhase?' on':'');
}

function updateObjCount(){
  $('obj-count-a').textContent=`異議 ${S.objA}回`;
  $('obj-count-b').textContent=`異議 ${S.objB}回`;
}

function updateRoundIndicator(){
  const rNum=S.roundCount+1;
  const rLabel=S.maxRounds===0?`ラウンド${rNum}`:`ラウンド${rNum} / ${S.maxRounds}`;
  $('round-indicator').textContent=`${rLabel}　${S.turnCount}/6発言`;
}

function updateTurn(judging=false,objTurn=false){
  const dot=$('tdot');
  if(judging){
    dot.className='tdot judging';
    $('ttext').textContent=objTurn?'異議を審査中…':'4体の審判が採点中…';
    $('sendbtn').disabled=true;$('obj-btn').disabled=true;$('concede-btn').disabled=true;
    return;
  }
  dot.className='tdot '+S.turn;
  $('ttext').textContent=(S.turn==='a'?S.na:S.nb)+'のターン';
  $('sendbtn').className='sendbtn '+S.turn;
  $('sendbtn').disabled=false;
  const objSide=S.turn==='a'?'b':'a';
  const objLeft=objSide==='a'?S.objA:S.objB;
  $('obj-btn').disabled=!S.canObject||objLeft<=0;
  $('obj-btn').textContent=`⚖ 判定に異議（残${objLeft}回）`;
  $('concede-btn').disabled=false;
}

function addMsg(side,name,text){
  const area=$('msgs');
  const d=document.createElement('div');
  d.className='msg '+side;
  if(name){const m=document.createElement('div');m.className='mmeta';m.textContent=name;d.appendChild(m);}
  const c=document.createElement('div');c.textContent=text;d.appendChild(c);
  area.appendChild(d);area.scrollTop=area.scrollHeight;
}

function addJudgePanel(results){
  const area=$('msgs');
  const d=document.createElement('div');
  d.className='msg judge';
  const [logic,evidence,persuasion,rational]=results;
  d.innerHTML=`
    <div class="judge-closed">⚖ ラウンド判定（タップで表示）</div>
    <div class="judge-detail">
      <div class="judge-scores">
        <div class="jscore"><div class="jscore-label">論理</div><div class="jscore-vals"><span class="jscore-val a">${logic.scoreA}</span><span style="color:#555">-</span><span class="jscore-val b">${logic.scoreB}</span></div></div>
        <div class="jscore"><div class="jscore-label">証拠</div><div class="jscore-vals"><span class="jscore-val a">${evidence.scoreA}</span><span style="color:#555">-</span><span class="jscore-val b">${evidence.scoreB}</span></div></div>
        <div class="jscore"><div class="jscore-label">説得</div><div class="jscore-vals"><span class="jscore-val a">${persuasion.scoreA}</span><span style="color:#555">-</span><span class="jscore-val b">${persuasion.scoreB}</span></div></div>
        <div class="jscore"><div class="jscore-label">合理</div><div class="jscore-vals"><span class="jscore-val a">${rational.scoreA}</span><span style="color:#555">-</span><span class="jscore-val b">${rational.scoreB}</span></div></div>
      </div>
      <div class="judge-comment">
        論理：${logic.comment||''}<br>
        証拠：${evidence.comment||''}<br>
        説得：${persuasion.comment||''}<br>
        合理：${rational.comment||''}
      </div>
    </div>
    <div class="judge-hint">タップで開閉</div>`;
  d.addEventListener('click',()=>{
    const det=d.querySelector('.judge-detail');
    const cl=d.querySelector('.judge-closed');
    det.classList.toggle('open');
    cl.textContent=det.classList.contains('open')?'⚖ ラウンド判定（タップで閉じる）':'⚖ ラウンド判定（タップで表示）';
  });
  area.appendChild(d);area.scrollTop=area.scrollHeight;
}

$('arginput').addEventListener('input',()=>{
  $('climit').textContent=$('arginput').value.length+' / 500字';
});

// ==================== TEST MODE ====================
const TEST_LINES=[
  {side:'a',text:'死刑制度は廃止すべきです。理由は三つあります。第一に、冤罪による執行は取り返しがつかない。第二に、死刑が犯罪抑止力になるという統計的根拠は存在しない。第三に、国家が人の命を奪う権限を持つべきではないという倫理的立場です。'},
  {side:'b',text:'死刑制度は維持すべきです。まず被害者遺族の感情的回復という観点から、極刑が持つ意味は無視できません。また終身刑では脱走・獄中犯罪のリスクが残ります。さらに日本の世論調査では死刑支持が一貫して80%を超えており、民主主義的な観点からも廃止は難しい。'},
  {side:'a',text:'抑止力については反論します。法務省の調査でも、死刑存置国と廃止国の殺人発生率に有意差はありません。感情的な納得感と、実際の犯罪抑止は別物です。また「被害者感情」は重要ですが、それは刑事司法の目的である再発防止・社会復帰と別に議論すべきです。'},
  {side:'b',text:'統計の解釈には慎重であるべきです。廃止国と存置国を単純比較するのは、文化・経済・治安状況が異なる国を並べることであり、適切な比較ではありません。日本国内においては、極刑の存在が一定の抑止的文脈を形成していると考えるのが自然です。'},
  {side:'a',text:'冤罪リスクは理論ではなく現実です。日本でも免田事件・財田川事件など、死刑確定後に無罪となった事例が複数あります。完璧な司法制度は存在しない以上、取り返しのつかない刑罰を維持することは制度設計として合理的ではありません。'},

$('test-btn').addEventListener('click',async()=>{
  // 設定を自動入力
  $('topic').value='死刑制度は廃止すべきか';
  $('na').value='廃止';
  $('nb').value='残置';
  // ラウンド1に設定
  document.querySelectorAll('.round-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.round-btn[data-val="1"]').classList.add('active');
  selectedRounds=1;
  // 討論開始
  $('start-btn').click();
  // 少し待ってから順番に自動送信
  await new Promise(r=>setTimeout(r,500));
  for(const line of TEST_LINES){
    // ターンが合うまで待つ
    await new Promise(r=>{
      const check=()=>{
        if(S.turn===line.side&&!S.busy) r();
        else setTimeout(check,200);
      };
      check();
    });
    $('arginput').value=line.text;
    $('sendbtn').click();
    await new Promise(r=>setTimeout(r,300));
  }
});

// ==================== RETRACT ====================
let retractPending=false;
let retractRequestSide=null;

function updateRetractUI(){
  const retractArea=$('retract-area');
  const confirmArea=$('retract-confirm-area');
  if(!retractArea||!confirmArea) return;
  if(retractPending){
    // 申請した側とは反対のターン（承認待ち）
    retractArea.style.display='none';
    if(S.turn!==retractRequestSide){
      confirmArea.style.display='block';
    } else {
      confirmArea.style.display='none';
    }
  } else {
    confirmArea.style.display='none';
    // 直前の発言が自分のターン（相手が今発言した直後）なら取り消し申請可能
    if(S.msgs.length>0&&!S.busy&&!S.ended){
      retractArea.style.display='block';
    } else {
      retractArea.style.display='none';
    }
  }
}

document.addEventListener('click',e=>{
  if(e.target.id==='retract-req-btn'){
    if(S.busy||S.ended||retractPending) return;
    const lastMsg=S.msgs[S.msgs.length-1];
    if(!lastMsg) return;
    retractPending=true;
    retractRequestSide=lastMsg.side;
    addMsg('system',null,`${lastMsg.side==='a'?S.na:S.nb}が直前の発言の取り消しを申請しました。相手の承認を待っています。`);
    updateRetractUI();
  }
  if(e.target.id==='retract-approve-btn'){
    if(!retractPending) return;
    const lastMsg=S.msgs[S.msgs.length-1];
    const lastBuf=S.buffer[S.buffer.length-1];
    S.msgs.pop();
    if(lastBuf) S.buffer.pop();
    if(S.turnCount>0) S.turnCount--;
    // メッセージ欄の最後のmsgを削除
    const area=$('msgs');
    const children=[...area.children];
    // system msgを削除してから最後の発言msgを削除
    for(let i=children.length-1;i>=0;i--){
      if(children[i].classList.contains('system')){children[i].remove();break;}
    }
    // 最後の発言msg（a or b）を削除
    const allMsgs=[...area.children];
    for(let i=allMsgs.length-1;i>=0;i--){
      if(allMsgs[i].classList.contains('a')||allMsgs[i].classList.contains('b')){
        allMsgs[i].remove();break;
      }
    }
    S.turn=lastMsg.side;
    retractPending=false;retractRequestSide=null;
    addMsg('bonus',null,'取り消しが承認されました。発言を取り消しました。');
    updateJudgePip(S.turnCount);
    // pip戻し
    const pip=$(`pip-${S.turnCount}`);
    if(pip) pip.classList.remove('done');
    updateRoundIndicator();
    updateTurn();updateTimerDisplay();updateRetractUI();
  }
  if(e.target.id==='retract-deny-btn'){
    if(!retractPending) return;
    retractPending=false;retractRequestSide=null;
    // system msgを削除
    const area=$('msgs');
    const children=[...area.children];
    for(let i=children.length-1;i>=0;i--){
      if(children[i].classList.contains('system')){children[i].remove();break;}
    }
    addMsg('penalty',null,'取り消し申請が拒否されました。');
    updateRetractUI();
  }
});

// ==================== JUDGE CALLS ====================
function safeParseJSON(raw){
  // 1. コードブロック除去
  let s=raw.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
  // 2. 先頭の{から最後の}までを抽出
  const start=s.indexOf('{');
  const end=s.lastIndexOf('}');
  if(start!==-1&&end!==-1&&end>start) s=s.slice(start,end+1);
  return JSON.parse(s);
}

async function callJudge(system, buffer){
  const hist=buffer.map(m=>`[${m.name}（${m.side==='a'?'青':'赤'}）]: ${m.text}`).join('\n');
  const res=await fetch('/api/judge',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      system,
      messages:[{role:'user',content:`テーマ：${S.topic}\n現在Eコイン：${S.na} ${Math.round(S.ecoinA)} / ${S.nb} ${Math.round(S.ecoinB)}\n\n【今回の6発言】\n${hist}`}]
    })
  });
  const data=await res.json();
  const raw=data.content.filter(c=>c.type==='text').map(c=>c.text).join('').trim();
  return safeParseJSON(raw);
}

const DEFAULT_RESULT={scoreA:100,scoreB:100,fallaciesA:[],fallaciesB:[],comment:'採点不可'};

async function callPairJudges(key1, key2, sys1, sys2, buffer){
  const hist=buffer.map(m=>`[${m.name}（${m.side==='a'?'青':'赤'}）]: ${m.text}`).join('\n');
  const system=`あなたは2役の審判AIです。JSONのみで返答。マークダウン不要。

=== ${key1}審判の役割 ===
${sys1}

=== ${key2}審判の役割 ===
${sys2}

出力形式（JSONのみ、キーは必ず英字）：
{"${key1}":{"scoreA":整数,"scoreB":整数,"fallaciesA":[{"name":"反則名","penalty":数値,"evidence":"文言"}],"fallaciesB":[{"name":"反則名","penalty":数値,"evidence":"文言"}],"comment":"2文"},"${key2}":{"scoreA":整数,"scoreB":整数,"fallaciesA":[{"name":"反則名","penalty":数値,"evidence":"文言"}],"fallaciesB":[{"name":"反則名","penalty":数値,"evidence":"文言"}],"comment":"2文"}}`;
  const res=await fetch('/api/judge',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      system,
      messages:[{role:'user',content:`テーマ：${S.topic}\nEコイン：${S.na} ${Math.round(S.ecoinA)} / ${S.nb} ${Math.round(S.ecoinB)}\n\n【6発言】\n${hist}`}]
    })
  });
  const data=await res.json();
  const raw=data.content.filter(c=>c.type==='text').map(c=>c.text).join('').trim();
  const parsed=safeParseJSON(raw);
  return [parsed[key1]||{...DEFAULT_RESULT}, parsed[key2]||{...DEFAULT_RESULT}];
}

async function callAllJudges(buffer){
  const [logic,evidence]=await callPairJudges('logic','evidence',LOGIC_SYSTEM,EVIDENCE_SYSTEM,buffer).catch(()=>[{...DEFAULT_RESULT},{...DEFAULT_RESULT}]);
  const [persuasion,rational]=await callPairJudges('persuasion','rational',PERSUASION_SYSTEM,RATIONAL_SYSTEM,buffer).catch(()=>[{...DEFAULT_RESULT},{...DEFAULT_RESULT}]);
  return [logic,evidence,persuasion,rational];
}

function applyRoundResults(results){
  const [logic,evidence,persuasion,rational]=results;
  // 4軸スコアを更新
  S.logicA+=logic.scoreA-100; S.logicB+=logic.scoreB-100;
  S.evidenceA+=evidence.scoreA-100; S.evidenceB+=evidence.scoreB-100;
  S.persuasionA+=persuasion.scoreA-100; S.persuasionB+=persuasion.scoreB-100;
  S.rationalA+=rational.scoreA-100; S.rationalB+=rational.scoreB-100;

  // Eコインへの反映：今ラウンドの4軸合計で差分を計算
  const roundTotalA=logic.scoreA+evidence.scoreA+persuasion.scoreA+rational.scoreA;
  const roundTotalB=logic.scoreB+evidence.scoreB+persuasion.scoreB+rational.scoreB;
  // 差分のみEコインに反映（勝った分だけ加点・負けた分だけ減点）
  const roundDiff=Math.round((roundTotalA-roundTotalB)/8);
  S.ecoinA=Math.max(0,Math.round(S.ecoinA+roundDiff));
  S.ecoinB=Math.max(0,Math.round(S.ecoinB-roundDiff));

  // 反則ペナルティをEコインに追加反映
  const penA=[...results[0].fallaciesA||[],...results[1].fallaciesA||[],...results[2].fallaciesA||[],...results[3].fallaciesA||[]].reduce((s,f)=>s+(f.penalty||0),0);
  const penB=[...results[0].fallaciesB||[],...results[1].fallaciesB||[],...results[2].fallaciesB||[],...results[3].fallaciesB||[]].reduce((s,f)=>s+(f.penalty||0),0);
  S.ecoinA=Math.max(0,S.ecoinA-Math.min(penA,20));
  S.ecoinB=Math.max(0,S.ecoinB-Math.min(penB,20));

  // 反則メッセージ
  if(penA>0){
    const names=[...results[0].fallaciesA||[],...results[1].fallaciesA||[],...results[2].fallaciesA||[],...results[3].fallaciesA||[]].map(f=>f.name).join('、');
    addMsg('penalty',null,`⚠ ${S.na} 反則：${names}（-${Math.min(penA,20)}E）`);
  }
  if(penB>0){
    const names=[...results[0].fallaciesB||[],...results[1].fallaciesB||[],...results[2].fallaciesB||[],...results[3].fallaciesB||[]].map(f=>f.name).join('、');
    addMsg('penalty',null,`⚠ ${S.nb} 反則：${names}（-${Math.min(penB,20)}E）`);
  }
}

function logRoundResults(results){
  const [logic,evidence,persuasion,rational]=results;
  S.log.push(`\n【ラウンド${S.roundCount}判定】`);
  S.log.push(`  論理：${S.na} ${logic.scoreA} / ${S.nb} ${logic.scoreB}　${logic.comment||''}`);
  S.log.push(`  証拠：${S.na} ${evidence.scoreA} / ${S.nb} ${evidence.scoreB}　${evidence.comment||''}`);
  S.log.push(`  説得：${S.na} ${persuasion.scoreA} / ${S.nb} ${persuasion.scoreB}　${persuasion.comment||''}`);
  S.log.push(`  合理：${S.na} ${rational.scoreA} / ${S.nb} ${rational.scoreB}　${rational.comment||''}`);
  S.log.push(`  Eコイン：${S.na} ${Math.round(S.ecoinA)} / ${S.nb} ${Math.round(S.ecoinB)}`);
}

// ==================== CLOSE MATCH BONUS ====================
function calcWinBonus(diff){
  if(diff<=20) return 30;
  if(diff<=50) return 20;
  if(diff<=100) return 10;
  return 5;
}

// ==================== OBJECTION ====================
$('obj-btn').addEventListener('click',async()=>{
  if(!S.canObject||S.busy||!S.lastJudgeResult) return;
  const objSide=S.turn==='a'?'b':'a';
  const objLeft=objSide==='a'?S.objA:S.objB;
  if(objLeft<=0) return;
  S.busy=true;updateTurn(true,true);
  try{
    const lastMsg=S.msgs[S.msgs.length-1];
    const objName=objSide==='a'?S.na:S.nb;
    const res=await callObjReview(lastMsg,S.lastJudgeResult,objName);
    const d=document.createElement('div');
    d.className='msg objection';
    d.innerHTML=`<div class="mmeta">⚖ ${objName}の異議</div><div>${res.verdict}</div>`;
    $('msgs').appendChild(d);$('msgs').scrollTop=$('msgs').scrollHeight;
    S.log.push(`\n  [異議：${objName}]`);
    if(res.sustained){
      const adj=res.scoreAdjust||0;
      if(adj>0){
        if(objSide==='b'){S.ecoinA=Math.max(0,S.ecoinA+adj);}
        else{S.ecoinB=Math.max(0,S.ecoinB+adj);}
        updateEcoinVisual(true);
      }
      addMsg('bonus',null,`異議認容（+${adj}E補正）`);
      S.log.push(`  → 認容（+${adj}E）：${res.verdict}`);
    } else {
      if(objSide==='a') S.objA=Math.max(0,S.objA-1);
      else S.objB=Math.max(0,S.objB-1);
      updateObjCount();
      S.log.push(`  → 棄却：${res.verdict}`);
    }
    S.canObject=false;
  }catch(e){addMsg('judge',null,'異議審査エラー。');}
  S.busy=false;updateTurn();
});

async function callObjReview(lastMsg,lastResult,objName){
  const res=await fetch('/api/judge',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      system:OBJ_SYSTEM,
      messages:[{role:'user',content:`テーマ：${S.topic}\n発言（${lastMsg.name}）："${lastMsg.text}"\n元の判定：${JSON.stringify(lastResult)}\n${objName}が異議申し立て。判定は正当でしたか？`}]
    })
  });
  const data=await res.json();
  const raw=data.content.filter(c=>c.type==='text').map(c=>c.text).join('').trim();
  return safeParseJSON(raw);
}

// ==================== CONCEDE ====================
$('concede-btn').addEventListener('click',()=>{
  if(S.busy||S.ended||S.finalObjPhase) return;
  const side=S.turn,name=side==='a'?S.na:S.nb;
  const winner=side==='a'?'b':'a';
  // 合理+20、論理+10ボーナスを付与してから終了
  if(side==='a'){S.rationalA+=20;S.logicA+=10;S.ecoinA=Math.min(S.ecoinA+8,300);}
  else{S.rationalB+=20;S.logicB+=10;S.ecoinB=Math.min(S.ecoinB+8,300);}
  if(side==='a'){S.rationalB+=5;S.ecoinB=Math.min(S.ecoinB+2,300);}
  else{S.rationalA+=5;S.ecoinA=Math.min(S.ecoinA+2,300);}
  updateEcoinVisual(true);
  addMsg('concede',null,`${name}が相手の主張を認めました（合理+20、論理+10ボーナス）`);
  S.log.push(`\n■ ${name}が主張を認め、合理・論理ボーナス加算`);
  setTimeout(()=>endDebate('concede',winner),800);
});

// ==================== FINAL OBJ PHASE ====================
function startFinalObjPhase(lastSide){
  S.finalObjPhase=true;
  const objSide=lastSide==='a'?'b':'a';
  const objName=objSide==='a'?S.na:S.nb;
  const objLeft=objSide==='a'?S.objA:S.objB;
  $('input-area').style.display='none';
  $('final-obj-area').style.display='block';
  $('final-obj-title').textContent=`最終発言への異議フェーズ　─　${objName}の番`;
  $('tdot').className='tdot judging';
  $('ttext').textContent=`${objName}：異議を出すか、パスするか`;
  addMsg('system',null,`─ 最終発言への異議フェーズ（${objName}） ─`);
  const objBtn=$('final-obj-btn');
  const passBtn=$('final-pass-btn');
  objBtn.disabled=objLeft<=0;
  objBtn.textContent=objLeft<=0?'異議なし（回数切れ）':`⚖ 最終発言に異議を出す（残${objLeft}回）`;
  objBtn.onclick=async()=>{
    if(S.busy) return;
    S.busy=true;objBtn.disabled=true;passBtn.disabled=true;
    $('ttext').textContent='異議を審査中…';
    try{
      const lastMsg=S.msgs.filter(m=>m.side===lastSide).slice(-1)[0];
      const objName2=objSide==='a'?S.na:S.nb;
      const res=await callObjReview(lastMsg,S.lastJudgeResult,objName2);
      const d=document.createElement('div');
      d.className='msg objection';
      d.innerHTML=`<div class="mmeta">⚖ ${objName2}の最終異議</div><div>${res.verdict}</div>`;
      $('msgs').appendChild(d);$('msgs').scrollTop=$('msgs').scrollHeight;
      if(res.sustained&&res.scoreAdjust>0){
        if(lastSide==='a'){S.ecoinA=Math.max(0,S.ecoinA+res.scoreAdjust);}
        else{S.ecoinB=Math.max(0,S.ecoinB+res.scoreAdjust);}
        updateEcoinVisual(true);
        addMsg('bonus',null,`最終異議認容（+${res.scoreAdjust}E）`);
      } else if(!res.sustained){
        if(objSide==='a') S.objA=Math.max(0,S.objA-1);
        else S.objB=Math.max(0,S.objB-1);
        updateObjCount();
      }
    }catch(e){addMsg('judge',null,'異議審査エラー。');}
    S.busy=false;
    endFinalObjPhase();
  };
  passBtn.onclick=()=>{endFinalObjPhase();};
}

function endFinalObjPhase(){
  S.finalObjPhase=false;
  $('final-obj-area').style.display='none';
  endDebate('points',null);
}

// ==================== END DEBATE ====================
async function endDebate(reason,winner){
  if(S.ended) return;
  S.ended=true;
  if(S.timerInterval) clearInterval(S.timerInterval);

  // 接戦ボーナス
  const ecoinDiff=Math.abs(S.ecoinA-S.ecoinB);
  const closeBonus=calcWinBonus(ecoinDiff);
  let winnerSide=winner;
  if(!winner){
    const totalA=S.logicA+S.evidenceA+S.persuasionA+S.rationalA;
    const totalB=S.logicB+S.evidenceB+S.persuasionB+S.rationalB;
    winnerSide=totalA>totalB?'a':totalA<totalB?'b':null;
  }
  if(winnerSide==='a'){S.ecoinA=Math.round(S.ecoinA+closeBonus);}
  else if(winnerSide==='b'){S.ecoinB=Math.round(S.ecoinB+closeBonus);}

  $('s-debate').style.display='none';
  $('s-verdict').style.display='flex';
  $('s-verdict').style.flexDirection='column';
  $('badge').textContent='終了';
  $('s-verdict').innerHTML='<div style="padding:2rem;text-align:center;color:#aaa;font-size:13px">最終判定を生成中…</div>';

  const badgeMap={time:['持ち時間切れ','time'],score:['Eコインゼロ','score'],points:['判定','points'],concede:['主張認定','concede']};
  const [badgeText,badgeClass]=badgeMap[reason]||['終了','points'];

    let wname,wcolor,reasonText;

      wname=winnerSide==='a'?S.na:S.nb;
      wcolor=winnerSide==='a'?'#5ba4f5':'#f5845b';
      if(reason==='time') reasonText=`${winnerSide==='a'?S.nb:S.na}の持ち時間がゼロになりました。`;

      else if(reason==='concede') reasonText=`${winnerSide==='a'?S.nb:S.na}が相手の主張を認めました。`;

        const res=await fetch('/api/judge',{

            system:'あなたはディベート最終審判です。討論全体を評価しJSONのみで返答。マークダウン不要。\n出力形式：{"reason":"3〜4文の総括"}',
            messages:[{role:'user',content:`テーマ：${S.topic}\n最終Eコイン：${S.na} ${Math.round(S.ecoinA)} / ${S.nb} ${Math.round(S.ecoinB)}\n全発言：\n${hist}`}]

      $('msgs').innerHTML='';
      $('input-area').style.display='block';
      $('final-obj-area').style.display='none';
    });

    $('log-btn').addEventListener('click',()=>{
      const modal=document.createElement('div');
      modal.className='log-modal';
      modal.innerHTML=`<div class="log-inner"><div class="log-header"><h3>討論ログ</h3><button class="log-close" id="lc">×</button></div><div class="log-body">${logText}</div><div class="log-footer"><button class="copy-btn" id="cb">コピー</button></div></div>`;
      document.body.appendChild(modal);
      modal.querySelector('#lc').addEventListener('click',()=>modal.remove());
      modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});
      modal.querySelector('#cb').addEventListener('click',()=>{
        navigator.clipboard.writeText(logText).then(()=>{
          const btn=modal.querySelector('#cb');
          btn.textContent='コピーしました';btn.className='copy-btn copied';
          setTimeout(()=>{btn.textContent='コピー';btn.className='copy-btn';},2000);
        });
      });
    });
  }catch(e){
    const wname=S.ecoinA>S.ecoinB?S.na:S.ecoinA<S.ecoinB?S.nb:'引き分け';
    $('s-verdict').innerHTML=`<div class="vcard"><div class="vwinner">${wname} の勝利</div></div><div class="verdict-btns"><button class="restart-btn" id="rbtn">もう一度</button></div>`;
    $('rbtn').addEventListener('click',()=>location.reload());
  }
}
</script>
</body>
</html>
