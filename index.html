

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>レスバリング</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 1rem; }
#app { width: 100%; max-width: 640px; background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.08); margin-top: 1rem; }
.header { padding: 1.25rem 1.5rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 20px; font-weight: 600; }
.logo span { color: #D85A30; }
.badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; background: #e8f5e9; color: #2e7d32; }
.setup { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
.card { background: #fafafa; border: 1px solid #eee; border-radius: 12px; padding: 1.25rem; }
.card h3 { font-size: 13px; color: #888; margin-bottom: 0.75rem; font-weight: 500; }
.topic-input { width: 100%; padding: 10px 14px; font-size: 15px; border: 1px solid #ddd; border-radius: 8px; background: white; font-family: inherit; }
.topic-input:focus { outline: none; border-color: #999; }
.player-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pc { border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; gap: 8px; }
.pa { background: #e8f0fb; border: 1px solid #b5d4f4; }
.pb { background: #fdf0ea; border: 1px solid #f5c4b3; }
.plabel { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
.pa .plabel { color: #185FA5; }
.pb .plabel { color: #993C1D; }
.pname { background: transparent; border: none; border-bottom: 1px solid rgba(0,0,0,0.15); font-size: 15px; font-weight: 600; width: 100%; padding: 2px 0; font-family: inherit; }
.pname:focus { outline: none; }
.start-btn { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; background: #222; color: white; border: none; border-radius: 12px; cursor: pointer; }
.start-btn:hover { background: #444; }
.debate { display: flex; flex-direction: column; }
.gauge-sec { padding: 1rem 1.5rem; background: #f9f9f7; border-bottom: 1px solid #eee; }
.gauge-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.gname { font-size: 13px; font-weight: 600; }
.gname.a { color: #185FA5; }
.gname.b { color: #D85A30; }
.gscore { font-size: 13px; color: #888; }
.gauge-track { height: 10px; border-radius: 5px; background: #eee; position: relative; overflow: hidden; }
.gfa { position: absolute; left: 0; top: 0; bottom: 0; background: #378ADD; border-radius: 5px 0 0 5px; transition: width 0.8s ease; }
.gfb { position: absolute; right: 0; top: 0; bottom: 0; background: #D85A30; border-radius: 0 5px 5px 0; transition: width 0.8s ease; }
.gctr { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: white; transform: translateX(-50%); }
.turn-bar { padding: 6px 1.5rem; background: white; border-bottom: 1px solid #eee; font-size: 12px; color: #888; display: flex; align-items: center; gap: 8px; }
.tdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.tdot.a { background: #378ADD; }
.tdot.b { background: #D85A30; }
.tdot.judging { background: #aaa; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.2} }
.msgs { overflow-y: auto; padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 10px; min-height: 260px; max-height: 340px; }
.msg { max-width: 82%; border-radius: 12px; padding: 10px 14px; font-size: 14px; line-height: 1.6; }
.msg.a { align-self: flex-start; background: #e8f0fb; border: 1px solid #b5d4f4; color: #0C447C; }
.msg.b { align-self: flex-end; background: #fdf0ea; border: 1px solid #f5c4b3; color: #712B13; }
.msg.judge { align-self: center; max-width: 92%; background: #f5f5f0; border: 1px solid #e0e0d8; color: #666; font-size: 12px; text-align: center; font-style: italic; }
.msg.penalty { align-self: center; max-width: 92%; background: #fff0f0; border: 1px solid #ffd0d0; color: #c00; font-size: 12px; text-align: center; }
.mmeta { font-size: 11px; margin-bottom: 4px; font-weight: 600; opacity: 0.6; }
.input-area { border-top: 1px solid #eee; padding: 1rem 1.5rem; background: white; }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
.arginput { flex: 1; padding: 10px 14px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; resize: none; min-height: 42px; max-height: 120px; line-height: 1.5; }
.arginput:focus { outline: none; border-color: #999; }
.sendbtn { padding: 10px 18px; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.sendbtn.a { background: #378ADD; color: white; }
.sendbtn.b { background: #D85A30; color: white; }
.sendbtn:disabled { opacity: 0.4; cursor: not-allowed; }
.climit { font-size: 11px; color: #bbb; margin-top: 4px; text-align: right; }
.verdict { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
.vcard { background: #fafafa; border: 1px solid #eee; border-radius: 12px; padding: 1.5rem; text-align: center; }
.vwinner { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
.vsub { font-size: 14px; color: #888; }
.vreason { margin-top: 1rem; font-size: 13px; line-height: 1.7; color: #666; text-align: left; }
.srow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 1rem; }
.sbox { padding: 1rem; border-radius: 8px; text-align: center; }
.sbox.a { background: #e8f0fb; }
.sbox.b { background: #fdf0ea; }
.snum { font-size: 32px; font-weight: 700; }
.sbox.a .snum { color: #185FA5; }
.sbox.b .snum { color: #993C1D; }
.slabel { font-size: 12px; color: #888; }
.restart-btn { padding: 12px; font-size: 14px; background: white; border: 1px solid #ddd; border-radius: 12px; cursor: pointer; }
.restart-btn:hover { background: #f5f5f0; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">レス<span>バ</span>リング</div>
    <div class="badge" id="badge">設定中</div>
  </div>
  <div id="s-setup" class="setup">
    <div class="card">
      <h3>討論テーマ</h3>
      <input class="topic-input" id="topic" placeholder="例：SNSは社会を分断するか" />
    </div>
    <div class="card">
      <h3>参加者</h3>
      <div class="player-row">
        <div class="pc pa"><div class="plabel">青コーナー</div><input class="pname" id="na" value="選手A" /></div>
        <div class="pc pb"><div class="plabel">赤コーナー</div><input class="pname" id="nb" value="選手B" /></div>
      </div>
    </div>
    <button class="start-btn" id="start-btn">討論開始</button>
  </div>
  <div id="s-debate" class="debate" style="display:none">
    <div class="gauge-sec">
      <div class="gauge-hdr">
        <span class="gname a" id="gna">選手A</span>
        <span class="gscore" id="gsc">50 – 50</span>
        <span class="gname b" id="gnb">選手B</span>
      </div>
      <div class="gauge-track">
        <div class="gfa" id="gfa" style="width:50%"></div>
        <div class="gfb" id="gfb" style="width:50%"></div>
        <div class="gctr"></div>
      </div>
    </div>
    <div class="turn-bar"><div class="tdot a" id="tdot"></div><span id="ttext">選手Aのターン</span></div>
    <div class="msgs" id="msgs"></div>
    <div class="input-area">
      <div class="input-row">
        <textarea class="arginput" id="arginput" rows="2" placeholder="主張を入力…"></textarea>
        <button class="sendbtn a" id="sendbtn">送信</button>
      </div>
      <div class="climit" id="climit">0 / 500字</div>
    </div>
  </div>
  <div id="s-verdict" class="verdict" style="display:none"></div>
</div>
<script>
const FALLACIES=[
  {name:'人身攻撃',desc:'相手の人格・属性を攻撃している',penalty:15},
  {name:'藁人形論法',desc:'相手の主張を歪めて攻撃している',penalty:12},
  {name:'論点すり替え',desc:'無関係な話題に誘導している',penalty:10},
  {name:'循環論法',desc:'結論を前提に使っている',penalty:8},
  {name:'スリッパリースロープ',desc:'根拠なく飛躍した連鎖を主張',penalty:8},
  {name:'早まった一般化',desc:'少数例から過度に一般化',penalty:7},
  {name:'権威への訴え',desc:'根拠なく権威で正当化',penalty:6},
  {name:'衆人への訴え',desc:'多数意見を論拠にしている',penalty:6},
  {name:'感情的訴えすぎ',desc:'感情的煽動で論理の代わりにしている',penalty:6},
  {name:'偽の因果',desc:'相関を因果と混同',penalty:8},
  {name:'二項対立の誤り',desc:'複数の選択肢を二択に矮小化',penalty:7},
  {name:'相手意見の無視',desc:'相手の論点に全く応答していない',penalty:10},
  {name:'論理破綻',desc:'前提と結論が繋がっていない・自己矛盾',penalty:12},
  {name:'事実歪曲',desc:'統計・事実を意図的に誤用・改ざん',penalty:15},
  {name:'モラル等価の誤り',desc:'軽微な行為と重大な問題を同列視',penalty:6},
  {name:'サンクコスト誤謬',desc:'過去のコストを理由に論を展開',penalty:5},
];
let S={topic:'',na:'',nb:'',sa:50,sb:50,turn:'a',msgs:[],round:0,max:6,busy:false};
const $=id=>document.getElementById(id);
$('start-btn').addEventListener('click',()=>{
  const t=$('topic').value.trim();
  if(!t){$('topic').focus();return;}
  S.topic=t;S.na=$('na').value.trim()||'選手A';S.nb=$('nb').value.trim()||'選手B';
  $('s-setup').style.display='none';
  $('s-debate').style.display='flex';
  $('s-debate').style.flexDirection='column';
  $('badge').textContent='討論中';
  $('gna').textContent=S.na;$('gnb').textContent=S.nb;
  updateGauge();updateTurn();
  addMsg('judge',null,`テーマ：「${S.topic}」　討論開始。${S.na}から先攻。`);
});
function updateGauge(){
  const t=S.sa+S.sb;
  const pa=Math.round(S.sa/t*100);
  $('gfa').style.width=pa+'%';
  $('gfb').style.width=(100-pa)+'%';
  $('gsc').textContent=`${S.sa} – ${S.sb}`;
}
function updateTurn(judging=false){
  if(judging){
    $('tdot').className='tdot judging';
    $('ttext').textContent='審判が採点中…';
    $('sendbtn').disabled=true;
    return;
  }
  $('tdot').className='tdot '+S.turn;
  $('ttext').textContent=(S.turn==='a'?S.na:S.nb)+'のターン';
  $('sendbtn').className='sendbtn '+S.turn;
  $('sendbtn').disabled=false;
}
function addMsg(side,name,text){
  const area=$('msgs');
  const d=document.createElement('div');
  d.className='msg '+side;
  if(name){const m=document.createElement('div');m.className='mmeta';m.textContent=name;d.appendChild(m);}
  const c=document.createElement('div');c.textContent=text;d.appendChild(c);
  area.appendChild(d);
  area.scrollTop=area.scrollHeight;
}
$('arginput').addEventListener('input',()=>{
  const l=$('arginput').value.length;
  $('climit').textContent=`${l} / 500字`;
});
$('sendbtn').addEventListener('click',async()=>{
  if(S.busy)return;
  const text=$('arginput').value.trim();
  if(!text||text.length>500)return;
  const side=S.turn;
  const name=side==='a'?S.na:S.nb;
  addMsg(side,name,text);
  $('arginput').value='';$('climit').textContent='0 / 500字';
  S.msgs.push({side,name,text});S.round++;S.busy=true;
  updateTurn(true);
  try{
    const result=await callJudge(text,side);
    if(result.fallacies&&result.fallacies.length>0){
      const names=result.fallacies.map(f=>f.name).join('、');
      const pen=result.fallacies.reduce((s,f)=>s+(f.penalty||8),0);
      addMsg('penalty',null,`⚠ 反則：${names}（-${pen}点）`);
      if(side==='a')S.sa=Math.max(0,S.sa-pen);
      else S.sb=Math.max(0,S.sb-pen);
    }
    const sc=result.scoreChange||0;
    if(sc>0){
      if(side==='a'){S.sa=Math.min(150,S.sa+sc);S.sb=Math.max(0,S.sb-Math.floor(sc*0.4));}
      else{S.sb=Math.min(150,S.sb+sc);S.sa=Math.max(0,S.sa-Math.floor(sc*0.4));}
    }
    updateGauge();
    addMsg('judge','審判',result.comment);
    S.turn=side==='a'?'b':'a';
    if(S.round>=S.max){setTimeout(endDebate,600);return;}
    updateTurn();
  }catch(e){
    addMsg('judge',null,'採点エラー。続行します。');
    S.turn=side==='a'?'b':'a';
    updateTurn();
  }
  S.busy=false;
});
async function callJudge(text,side){
  const hist=S.msgs.slice(-6).map(m=>`[${m.name}]: ${m.text}`).join('\n');
  const name=side==='a'?S.na:S.nb;
  const res=await fetch('/api/judge',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      system:`あなたはディベート審判AIです。発言を評価しJSONのみで返答してください。マークダウン・コードブロック不要。\n反則リスト：\n${FALLACIES.map(f=>`- ${f.name}（ペナルティ${f.penalty}）：${f.desc}`).join('\n')}\n出力形式：{"fallacies":[{"name":"反則名","penalty":数値}],"scoreChange":0〜15の整数,"comment":"2〜3文の審判コメント"}`,
      messages:[{role:'user',content:`テーマ：${S.topic}\n現在スコア：${S.na} ${S.sa}点 / ${S.nb} ${S.sb}点\n直近の発言：\n${hist}\n今回の発言（${name}）：\n"${text}"`}]
    })
  });
  const data=await res.json();
  const raw=data.content.filter(c=>c.type==='text').map(c=>c.text).join('').trim();
  return JSON.parse(raw.replace(/```json|```/g,'').trim());
}
async function endDebate(){
  $('s-debate').style.display='none';
  $('s-verdict').style.display='flex';
  $('s-verdict').style.flexDirection='column';
  $('badge').textContent='終了';
  $('s-verdict').innerHTML='<div style="padding:2rem;text-align:center;color:#888;font-size:13px">最終判定を生成中…</div>';
  try{
    const hist=S.msgs.map(m=>`[${m.name}]: ${m.text}`).join('\n');
    const res=await fetch('/api/judge',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        system:'あなたはディベート最終審判です。討論全体を評価しJSONのみで返答。マークダウン不要。\n出力形式：{"winner":"a"または"b"または"draw","reason":"3〜4文の総括コメント"}',
        messages:[{role:'user',content:`テーマ：${S.topic}\n最終スコア：${S.na} ${S.sa}点 / ${S.nb} ${S.sb}点\n全発言：\n${hist}`}]
      })
    });
    const data=await res.json();
    const raw=data.content.filter(c=>c.type==='text').map(c=>c.text).join('').trim();
    const r=JSON.parse(raw.replace(/```json|```/g,'').trim());
    const wname=r.winner==='a'?S.na:r.winner==='b'?S.nb:'引き分け';
    const wcolor=r.winner==='a'?'#185FA5':r.winner==='b'?'#993C1D':'#666';
    $('s-verdict').innerHTML=`
      <div class="vcard">
        <div style="font-size:12px;color:#888;margin-bottom:8px">最終判定</div>
        <div class="vwinner" style="color:${wcolor}">${wname} の勝利</div>
        <div class="vsub">テーマ：${S.topic}</div>
        <div class="srow">
          <div class="sbox a"><div class="snum">${S.sa}</div><div class="slabel">${S.na}</div></div>
          <div class="sbox b"><div class="snum">${S.sb}</div><div class="slabel">${S.nb}</div></div>
        </div>
        <div class="vreason">${r.reason}</div>
      </div>
      <button class="restart-btn" id="rbtn">もう一度</button>`;
    $('rbtn').addEventListener('click',()=>{
      S={topic:'',na:'',nb:'',sa:50,sb:50,turn:'a',msgs:[],round:0,max:6,busy:false};
      $('s-verdict').style.display='none';
      $('s-setup').style.display='flex';
      $('badge').textContent='設定中';
    });
  }catch(e){
    const wname=S.sa>S.sb?S.na:S.sa<S.sb?S.nb:'引き分け';
    $('s-verdict').innerHTML=`<div class="vcard"><div class="vwinner">${wname} の勝利</div><div class="vsub">${S.sa} – ${S.sb}</div></div><button class="restart-btn" id="rbtn">もう一度</button>`;
    $('rbtn').addEventListener('click',()=>location.reload());
  }
}
</script>
</body>
</html>
